<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التدريب وتنمية الموارد البشرية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f7;--sf:#fff;--ink:#10264a;--mu:#51627a;--tl:#0f8b8d;--gd:#f2a93b;--nv:#10264a;--ln:#dbe4ec;--sh:0 8px 24px rgba(16,38,74,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1424;--sf:#13223b;--ink:#eaf0f8;--mu:#9fb1c8;--tl:#2cc3c5;--gd:#f5b84f;--nv:#0d2147;--ln:#243652;--sh:0 8px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;overflow:hidden}
.s{position:absolute;inset:0;overflow-y:auto;opacity:0;visibility:hidden;transform:scale(.97);transition:opacity .6s,transform .6s,visibility 0s .6s;padding:0 5vw 84px}
.s.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.in{max-width:1120px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:28px 0}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes grow{from{opacity:0;transform:scaleY(.05)}to{opacity:1;transform:none}}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes zoom{from{transform:scale(1)}to{transform:scale(1.08)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
@keyframes shine{0%{background-position:0 0}100%{background-position:200% 0}}
.on .a{animation:up .75s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*.09s + .15s)}
.on .a.pop{animation-name:pop}.on .a.gr{animation-name:grow}
header h2{font-size:clamp(26px,4vw,42px);margin:0;font-weight:800;line-height:1.35}
header h2::after{content:"";display:block;width:70px;height:5px;border-radius:9px;margin-top:10px;background:linear-gradient(90deg,var(--gd),var(--tl))}
.en{margin:8px 0 0;color:var(--tl);font-weight:600;font-size:clamp(14px,1.8vw,18px);direction:ltr;text-align:right}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;box-shadow:var(--sh);transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(16,38,74,.16)}
.ic{flex:none;width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:22px;font-style:normal;background:linear-gradient(135deg,var(--tl),#0b5f6e);box-shadow:0 4px 12px rgba(15,139,141,.35)}
.ic.g{background:linear-gradient(135deg,var(--gd),#d9822b)}
.row{display:flex;align-items:center;gap:14px}
.row p,.card p{margin:0;line-height:1.85;font-size:clamp(15px,1.7vw,18px)}
.card h3{margin:0 0 6px;font-size:19px;color:var(--tl)}
.col h3.hd{margin:0 0 12px;padding:10px 16px;border-radius:12px;background:var(--nv);color:#fff;font-size:18px;display:flex;align-items:center;gap:10px}
.col h3.hd.t{background:var(--tl)}
.stack{display:flex;flex-direction:column;gap:12px}
.ph{border-radius:18px;overflow:hidden;box-shadow:var(--sh);max-height:230px}
.ph img{width:100%;height:100%;max-height:230px;object-fit:cover;display:block;animation:zoom 14s ease-in-out infinite alternate}
.key{background:var(--nv);color:#fff;border-radius:14px;padding:16px 20px;font-size:clamp(15px,1.8vw,19px);line-height:1.8}
.key b{color:var(--gd)}
.q{font-weight:700;font-size:clamp(17px,2.2vw,24px);margin:0}
/* cover */
#s1{background:#0c1f44;color:#fff;padding-bottom:84px}
#s1 .bl{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;animation:drift 12s ease-in-out infinite}
#s1 .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:28px 28px}
#s1 .in{position:relative;justify-content:space-between;gap:22px}
.top{display:flex;align-items:center;gap:16px}
.top img{width:84px;height:84px;border-radius:16px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.top p{margin:0;line-height:1.7;font-size:clamp(14px,1.8vw,18px)}
.top b{font-size:clamp(15px,2vw,20px)}
.ttl{font-size:clamp(34px,6.4vw,70px);font-weight:800;line-height:1.25;margin:0;background:linear-gradient(100deg,#fff 30%,var(--gd) 50%,#fff 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.sub{font-size:clamp(16px,2.4vw,26px);color:var(--gd);font-weight:600;margin:8px 0 14px;direction:ltr;text-align:right}
.chip{display:inline-block;border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 18px;font-size:clamp(14px,1.8vw,18px)}
.bt{display:grid;gap:14px;grid-template-columns:2fr 1fr}
.gl{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:16px;padding:16px 20px}
.gl h4{margin:0 0 8px;color:var(--gd);font-size:17px}
.gl p{margin:0;line-height:1.9;font-size:clamp(14px,1.7vw,17px)}
.gl.sp{display:flex;flex-direction:column;justify-content:center;background:rgba(15,139,141,.45)}
.gl.sp p{font-size:clamp(17px,2.2vw,22px);font-weight:700}
/* process / flows */
.steps{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.steps .ln{position:absolute;top:31px;right:9%;left:9%;height:4px;background:linear-gradient(90deg,var(--gd),var(--tl));border-radius:9px;transform-origin:right;transform:scaleX(0)}
.on .steps .ln{animation:fill 1.8s .4s both}
.st{position:relative;text-align:center;padding:0 6px}
.st .n{width:62px;height:62px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:#fff;background:var(--tl);border:5px solid var(--bg);box-shadow:var(--sh)}
.st:nth-child(odd) .n{background:var(--nv)}.st:nth-child(even) .n{background:var(--tl)}.st.last .n{background:var(--gd);color:#10264a}
.st b{display:block;font-size:17px;line-height:1.6}.st small{display:block;color:var(--tl);font-weight:700;direction:ltr;margin-top:4px}
/* stats */
.stat{text-align:center}
.stat b{display:block;font-size:clamp(30px,4.6vw,50px);font-weight:800;color:var(--tl);line-height:1.2}
.stat span{color:var(--mu);font-size:16px}
/* stairs */
.stairs{display:flex;align-items:flex-end;gap:14px;min-height:280px}
.stp{flex:1;border-radius:16px 16px 0 0;padding:18px;color:#fff;transform-origin:bottom;display:flex;flex-direction:column;gap:8px}
.stp h3{margin:0;font-size:20px}.stp h3 small{display:block;font-size:14px;opacity:.85;direction:ltr;text-align:right}
.stp p{margin:0;line-height:1.8;font-size:15px}.stp .tr{background:rgba(255,255,255,.18);border-radius:10px;padding:8px 10px}
.lad{display:flex;flex-direction:column;align-items:center;gap:10px}
.lad div{border-radius:12px;padding:12px;text-align:center;font-weight:700;color:#fff;transform-origin:center}
.refs{direction:ltr;text-align:left}.refs p{font-size:14px!important;line-height:1.7;margin:0 0 8px;color:var(--mu)}
.chips{display:flex;flex-direction:column;gap:8px;margin-top:10px}.chips span{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:8px 12px;font-size:16px}.chips span.h{background:var(--gd);color:#10264a;font-weight:700;border-color:var(--gd)}
/* nav */
#pg{position:fixed;top:env(safe-area-inset-top,0px);right:0;left:0;height:4px;background:transparent;z-index:9}
#pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--tl),var(--gd));transition:width .5s;float:right}
.nav{position:fixed;bottom:0;right:0;left:0;z-index:9;display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,rgba(8,20,40,.55))}
.nav button{border:0;border-radius:50%;width:44px;height:44px;font:700 20px Cairo,sans-serif;cursor:pointer;background:rgba(255,255,255,.92);color:#10264a;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .2s}
.nav button:hover{transform:scale(1.1)}.nav button:disabled{opacity:.4}
.nav span{color:#fff;font-weight:700;min-width:64px;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.6)}
@media (max-width:760px){.bt{grid-template-columns:1fr}.stairs{flex-direction:column;align-items:stretch}.stp{border-radius:16px}.steps .ln{display:none}.top img{width:64px;height:64px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="pg"><i id="pgi"></i></div>
<main id="deck"></main>
<div class="nav"><button id="nx" aria-label="التالي">‹</button><span id="ct"></span><button id="pv" aria-label="السابق">›</button><button id="fs" aria-label="ملء الشاشة" style="font-size:16px">⛶</button></div>
